name: CI

# 只在集成分支 wb-main 上跑。
#
# push 限分支：贡献者在自己的分支上反复推 WIP 不会触发 CI，省额度也省等待。
# pull_request 也限分支：这里限制的是 **base**，也就是「合并进 wb-main 的 PR」。
# 贡献者的分支不需要登记在这里——PR 一开就会跑。
#
# 副作用：合并进别的分支的 PR 不会跑 CI。若将来多出别的集成分支，
# 需要同时加进这两处。
on:
  push:
    branches: [wb-main]
  pull_request:
    branches: [wb-main]
  workflow_dispatch:

# 同一分支上新的推送取消上一次没跑完的，省时间也省额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      # 一个版本失败不取消另一个——需要同时知道 3.12 和 3.13 的结果。
      fail-fast: false
      matrix:
        # 3.12 是 pyproject 里声明的下限。只测下限会漏掉新版行为变化，
        # 只测新版则会放过「在别人机器上装不上」。两个都测。
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # 默认的 addopts 已经把 interactive 标记排除掉了（见 pyproject 的
      # pytest 配置），所以这里不会去驱动真实的 claude / kimi——
      # CI 上没有它们的登录态，也不该消耗任何人的账号额度。
      - name: Test
        run: python -m pytest -q

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 测 README 里声明的下限，而不是开发机上的版本。
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # 先测后构建：测试挂掉时不必再付一次构建的时间；
      # 测试本身不依赖 dist，顺序反了也没有信息量。
      - name: Test
        working-directory: web
        run: npm test

      # build 脚本本身就是 `tsc --noEmit && vite build`，类型检查和构建一步到位。
      # 拆成两步只是多花一次时间，失败信息并不会更清楚。
      - name: Typecheck and build
        working-directory: web
        run: npm run build

  # 汇总门禁。分支保护只需要勾这一个检查。
  #
  # 为什么不直接勾上面几个：矩阵展开出来的检查名是 "Python 3.12" / "Python 3.13"，
  # 名字随矩阵变。哪天加个 3.14 或去掉 3.12，分支保护里勾的那个名字就永远等不到，
  # PR 会一直卡在 "Expected — Waiting for status to be reported"——**不报错，
  # 只是永远合不了**。勾一个名字固定的汇总 job 就没这个问题。
  ci-ok:
    name: CI
    needs: [python, web]
    # 必须带 always()：不加的话上游一失败这个 job 会被直接跳过，而分支保护
    # 里「跳过」不算通过，PR 照样合不了——那就白加了。
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 核对上游作业结果
        run: |
          echo "python = ${{ needs.python.result }}"
          echo "web    = ${{ needs.web.result }}"
          if [ "${{ needs.python.result }}" != "success" ] \
             || [ "${{ needs.web.result }}" != "success" ]; then
            echo "::error::上游作业未全部成功，CI 不通过"
            exit 1
          fi
