name: CI

# 面向合并的检查：任何 PR 都要过，推送到主分支也要过。
on:
  push:
    branches: [wb-main, master]
  pull_request:
  workflow_dispatch:

# 同一分支上新的推送取消上一次没跑完的，省时间也省额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      # 一个版本失败不取消另一个——需要同时知道 3.12 和 3.13 的结果。
      fail-fast: false
      matrix:
        # 3.12 是 pyproject 里声明的下限。只测下限会漏掉新版行为变化，
        # 只测新版则会放过「在别人机器上装不上」。两个都测。
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # 默认的 addopts 已经把 interactive 标记排除掉了（见 pyproject 的
      # pytest 配置），所以这里不会去驱动真实的 claude / kimi——
      # CI 上没有它们的登录态，也不该消耗任何人的账号额度。
      - name: Test
        run: python -m pytest -q

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 测 README 里声明的下限，而不是开发机上的版本。
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # build 脚本本身就是 `tsc --noEmit && vite build`，类型检查和构建一步到位。
      # 拆成两步只是多花一次时间，失败信息并不会更清楚。
      - name: Typecheck and build
        working-directory: web
        run: npm run build
