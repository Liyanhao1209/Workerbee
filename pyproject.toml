[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workerbee"
version = "0.1.0"
description = "Workerbee - a cross-platform multi-agent workflow orchestration framework over local agent harnesses"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "aiosqlite>=0.20",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "httpx>=0.27",
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "ptyprocess>=0.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "anyio>=4.3",
]
tui = ["textual>=0.60"]

[project.scripts]
workerbee = "workerbee.cli:main"
workerbee-core = "workerbee.server.main:main"
workerbee-supervisor = "workerbee.supervisor.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/workerbee"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 120
# 必须用 signal 方法：默认的 thread 方法在「事件循环阻塞在 epoll_wait」时
# 根本不会触发——那正是异步代码最典型的挂起形态。用 thread 方法等于没有超时，
# 实测出现过整整跑了一小时四十分钟还没被中断的用例。
timeout_method = "signal"
# 默认不跑真实 harness（慢、要登录、要花 token）。要跑显式指定：
#   .venv/bin/python -m pytest -m interactive tests/interactive
addopts = '-m "not interactive"'
markers = [
    "unit: 单元测试（纯逻辑，无 IO）",
    "integration: 跨模块／跨层集成测试",
    "interactive: 驱动真实 harness CLI 的测试（慢、需要登录、消耗 token）",
    "scenario: AC-xx acceptance scenario tests",
    "fuzz: property-based tests",
]

[tool.hypothesis]
max_examples = 200
deadline = 5000
